yolo_detector_node:
  ros__parameters:
      model_path: '/home/qd/turtlebot4_ws/yolov8n.pt'
      # Raised 0.6 -> 0.75 to cut corner/wall false positives (e.g. a wall chunk
      # misread as 'person') that were wedging the robot in tight corridors.
      confidence_threshold: 0.75 
      image_topic: '/oakd/rgb/preview/image_raw'
      # 'compressed' decodes the JPEG image_transport stream (<image_topic>/compressed).
      image_transport: 'compressed'
      detection_topic: '/detections'
      device: 'cuda'
      publish_rate_limit: 10.0
      publish_visualisation: false 
      visualisation_topic: '/detections/image'
      target_classes:
        - 'person'
        - 'stop sign'

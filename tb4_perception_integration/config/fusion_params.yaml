# Parameters for depth_camera_fusion_node
depth_camera_fusion_node:
  ros__parameters:
    # Topics
    detection_topic: '/detections'
    depth_image_topic: '/oakd/stereo/image_raw'
    camera_info_topic: '/oakd/stereo/camera_info'
    detection_camera_info_topic: '/oakd/rgb/preview/camera_info'
    output_topic: '/semantic_obstacles'
    marker_topic: '/fusion_debug_markers'
    publish_debug_markers: false

    # Voxel downsampling (0 to disable)
    voxel_size: 0.05

    # RANSAC floor removal
    ransac_iterations: 50
    ransac_distance_threshold: 0.02
    floor_normal_tolerance: 0.3        # radians from vertical

    # Point matching & clustering
    min_cluster_points: 3
    depth_gap_threshold: 0.3           # metres
    max_obstacle_distance: 4.0         # metres

    # Temporal tracking
    ema_alpha: 0.3
    association_distance: 0.5          # metres
    min_hits_to_confirm: 3
    max_misses_to_delete: 5
    track_timeout: 1.0                 # seconds

    # Class-specific arrays (parallel)
    class_names:
      - 'stop sign'
      - 'do not enter'
    class_radii:
      - 0.08     # STOP: negligible keep-out -> robot drives THROUGH after the 2 s stop
      - 0.5      # DO NOT ENTER: blocking keep-out -> planner reroutes AROUND it
    # Non-lethal (<253) obstacles deter/reroute without hard-trapping; lethal
    # (254) forces a full reroute. The fusion node writes these into the
    # /semantic_obstacles 'cost' field, which the PerceptionLayer USES OVER its
    # nav2.yaml class_costs, so these are authoritative.
    class_costs:
      - 120.0   # stop sign  (non-blocking; the BT handles the temporal stop)
      - 254.0   # do not enter (lethal -> robot must not pass, reroute)

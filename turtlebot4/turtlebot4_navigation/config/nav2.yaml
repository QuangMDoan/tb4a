        # seen as 'person' at a corner) is dropped instead of stamped onto the
        # robot's own footprint.
        min_obstacle_distance: 0.55
        # Non-lethal (<253) so one false frame is soft-avoid, not a footprint
        # collision that makes MPPI fail to compute a path in a tight corridor.
        default_cost: 200
        default_radius: 0.3
        class_names: ['person', 'chair', 'dog', 'cat', 'bicycle', 'stop sign']
        # 'stop sign' = strong deterrent (250, just below inscribed 253): the planner
        # reroutes around its keep-out, but it is NOT lethal, so the inflation_layer
        # (which runs after this one) won't wrap it in an inscribed ring and MPPI /
        # planner can still escape if the robot ends up beside it (no hard trap).
        class_costs: [200, 200, 200, 180, 200, 250]
        class_radii: [0.25, 0.2, 0.2, 0.15, 0.35, 0.5]
        persistent_classes: ['stop sign']
        persistent_frame: "map"
        persistent_timeout: 600.0
        # A stop sign only becomes a costmap obstacle (-> reroute) once the robot
        # is within 1.5 m; farther than that it keeps the old plan.
        persistent_react_distance: 1.5
        # After a Nav2 recovery clears the costmap, don't let the live fusion
        # stream re-stamp transient obstacles for this long, so the robot can
        # move out of a spot a false detection had wedged it into.
        clear_suppression_time: 2.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Gentler slope (was 5.0) + wider radius (was 0.19) give the planner a
        # smooth centering gradient across the ~0.86 m hallway instead of a
        # near-binary wall. 0.30 < half-corridor (0.43 m) so the centre stays
        # non-lethal.
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Accept a nearby reachable pose when the exact goal is in inflated/lethal space.
      tolerance: 0.75
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Lowered 1.0 -> 0.5 to match the smoother/MPPI rotation cap: slow yaw everywhere,
    # including spin recovery, to keep AMCL scan matching stable in the hallway.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    # Softened 3.2 -> 1.5 to match the smoother/MPPI angular accel: gentle spin onset.
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Linear min 0.0 = forward-only (matches MPPI vx_min 0.0): the smoother won't
    # pass reverse commands, so the robot rotates to face its route instead of reversing.
    max_velocity: [0.35, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    # Softened so yaw/linear ramp in rather than snapping to the cap in ~0.15 s:
    # gentler onset reduces wheel slip and sudden scan jumps that disturb AMCL.
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      # Shorter forward projection so tight-hallway walls don't constantly throttle motion.
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      # Disabled: it throttled the robot to a crawl in the 0.86 m hallway; MPPI's
      # CostCritic (consider_footprint) still does collision avoidance.
      enabled: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15

bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    # Larger timeouts so a slow planner ack on the Pi's CPU doesn't fail the goal.
    default_server_timeout: 50
    wait_for_service_timeout: 3000
    action_server_result_timeout: 900.0
    # Custom BT nodes: turtlebot4_bt_plugins (IsGoalBehind + RotateAngle, rotate-first)
    # and is_stop_sign_nearby_bt_node (IsStopSignNearby). The stop-sign tree pauses
    # navigation when a 'stop sign' from /semantic_obstacles comes within range.
    plugin_lib_names: ["turtlebot4_bt_plugins", "is_stop_sign_nearby_bt_node"]
    default_nav_to_pose_bt_xml: "/home/qd/turtlebot4_ws/install/turtlebot4_navigation/share/turtlebot4_navigation/behavior_trees/navigate_to_pose_rotate_first_stopsign.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 0.3 -> 1.0 s: let MPPI keep retrying briefly when it transiently can't find a
    # trajectory (hallway pinch) instead of aborting to the 5 s recovery wait.
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Lenient so a slow crawl through narrow spaces isn't aborted.
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Coexist profile (perception + nav2 on the Pi): 40/600 instead of 50/1000
      # to free CPU for the OAK-D pipeline. Revert to 50/1000 for nav-only quality.
      time_steps: 40
      model_dt: 0.05
      batch_size: 600
      # Matched to the velocity_smoother accel caps (1.0 / 1.5) so MPPI plans at the
      # achievable ramp rate instead of commanding accels the smoother then clamps.
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Matched to velocity_smoother's linear caps (0.35 / -0.35) so MPPI plans at the
      # achievable speed instead of optimizing trajectories the smoother then clamps.
      vx_max: 0.35
      vx_min: -0.35
      vy_max: 0.5
      # Matched to velocity_smoother's 1.0 rad/s cap so MPPI plans at the achievable
      # rotation rate instead of commanding turns the smoother then clamps (adds lag).
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Larger window + TF slack to absorb Wi-Fi TF jitter (out-of-map-bounds raytrace warnings).
      width: 4
      height: 4
      resolution: 0.06
      transform_tolerance: 0.5
      # Circular footprint matching the round robot (0.17 m + 1 cm) so inflation can
      # equal the radius: safe (>= inscribed) without over-inflating the 0.86 m hallway.
      robot_radius: 0.18
      # 0.0 (not the 0.01 default) so inscribed == robot_radius 0.18: reclaims 1 cm of
      # corridor clearance so small AMCL yaw drift is less likely to lethal-ize the footprint.
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "perception_layer", "inflation_layer"]
      # Class-aware semantic obstacles from the camera-depth fusion node
      # (/semantic_obstacles). 'stop sign' is persisted in the map frame.
      perception_layer:
        plugin: "tb4_perception_layer::PerceptionLayer"
        enabled: true
        semantic_topic: "/semantic_obstacles"
        obstacle_timeout: 3.0
        min_obstacle_distance: 0.35
        default_cost: 254
        default_radius: 0.3
        class_names: ['person', 'chair', 'dog', 'cat', 'bicycle', 'stop sign']
        class_costs: [254, 254, 200, 180, 254, 254]
        class_radii: [0.3, 0.25, 0.2, 0.15, 0.4, 0.5]
        persistent_classes: ['stop sign']
        persistent_frame: "map"
        persistent_timeout: 600.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # >= inscribed 0.18 (robot_radius 0.18 + footprint_padding 0.0).
        inflation_radius: 0.19
      obstacle_layer:
        # 2D layer (not VoxelLayer): the only source is the 2D /scan, and voxel Z bounds
        # broke clearing when odom Z drift pushed the sensor origin below origin_z.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      robot_radius: 0.18
      # 0.0 (not the 0.01 default) so inscribed == robot_radius 0.18: reclaims 1 cm of
      # corridor clearance so small AMCL yaw drift is less likely to lethal-ize the footprint.
      footprint_padding: 0.0
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "perception_layer", "inflation_layer"]
      # Class-aware semantic obstacles from the camera-depth fusion node
      # (/semantic_obstacles). 'stop sign' is persisted in the map frame.
      perception_layer:
        plugin: "tb4_perception_layer::PerceptionLayer"
        enabled: true
        semantic_topic: "/semantic_obstacles"
        obstacle_timeout: 3.0
        min_obstacle_distance: 0.35
        default_cost: 254
        default_radius: 0.3
        class_names: ['person', 'chair', 'dog', 'cat', 'bicycle', 'stop sign']
        class_costs: [254, 254, 200, 180, 254, 254]
        class_radii: [0.3, 0.25, 0.2, 0.15, 0.4, 0.5]
        persistent_classes: ['stop sign']
        persistent_frame: "map"
        persistent_timeout: 600.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # >= inscribed 0.18 (robot_radius 0.18 + footprint_padding 0.0).
        inflation_radius: 0.19
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      # Accept a nearby reachable pose when the exact goal is in inflated/lethal space.
      tolerance: 0.75
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # Lowered 1.0 -> 0.5 to match the smoother/MPPI rotation cap: slow yaw everywhere,
    # including spin recovery, to keep AMCL scan matching stable in the hallway.
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    # Softened 3.2 -> 1.5 to match the smoother/MPPI angular accel: gentle spin onset.
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Rotational cap lowered 1.0 -> 0.5 rad/s: fast yaw degrades AMCL scan matching
    # in the narrow hallway. Linear kept at 0.35 to isolate the rotation effect.
    max_velocity: [0.35, 0.0, 1.0]
    min_velocity: [-0.35, 0.0, -1.0]
    # Softened so yaw/linear ramp in rather than snapping to the cap in ~0.15 s:
    # gentler onset reduces wheel slip and sudden scan jumps that disturb AMCL.
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      # Shorter forward projection so tight-hallway walls don't constantly throttle motion.
      time_before_collision: 0.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      # Disabled: it throttled the robot to a crawl in the 0.86 m hallway; MPPI's
      # CostCritic (consider_footprint) still does collision avoidance.
      enabled: False
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15

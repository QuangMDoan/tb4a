bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    # Larger timeouts so a slow planner ack on the Pi's CPU doesn't fail the goal.
    # 1000 ms (was 50): tolerates momentary load spikes when perception + nav2 share the Pi.
    default_server_timeout: 1000
    wait_for_service_timeout: 3000
    action_server_result_timeout: 900.0
    # Custom BT nodes: turtlebot4_bt_plugins (IsGoalBehind + RotateAngle, rotate-first)
    # and is_stop_sign_nearby_bt_node (IsStopSignNearby). The stop-sign tree pauses
    # navigation when a 'stop sign' from /semantic_obstacles comes within range.
    plugin_lib_names: ["turtlebot4_bt_plugins", "is_stop_sign_nearby_bt_node"]
    default_nav_to_pose_bt_xml: "/home/qd/turtlebot4_ws/install/turtlebot4_navigation/share/turtlebot4_navigation/behavior_trees/navigate_to_pose_rotate_first_stopsign.xml"
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # 1.0 -> 2.0 s: tolerate longer transient no-trajectory spells (localization
    # jitter in the 0.86 m hallway) before aborting to recovery.
    failure_tolerance: 2.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Lenient so a slow crawl through narrow spaces isn't aborted.
      required_movement_radius: 0.25
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Coexist profile (perception + nav2 on the Pi): 40/600 instead of 50/1000
      # to free CPU for the OAK-D pipeline. Revert to 50/1000 for nav-only quality.
      time_steps: 40
      model_dt: 0.05
      batch_size: 600
      # Matched to the velocity_smoother accel caps (1.0 / 1.5) so MPPI plans at the
      # achievable ramp rate instead of commanding accels the smoother then clamps.
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      # Matched to velocity_smoother's linear caps (0.35 / -0.35) so MPPI plans at the
      # achievable speed instead of optimizing trajectories the smoother then clamps.
      vx_max: 0.35
      # Forward-only: no reverse in path following, so following a 'go back' route
      # makes the robot rotate ~180 deg and drive forward instead of reversing.
      vx_min: 0.0
      vy_max: 0.5
      # Matched to velocity_smoother's 1.0 rad/s cap so MPPI plans at the achievable
      # rotation rate instead of commanding turns the smoother then clamps (adds lag).
      wz_max: 1.0
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # Weighted up (was 0.0) to favour rotate-then-forward over reversing.
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        # 8.0: with consider_footprint:false there is no hard footprint check, so
        # this is the ONLY thing keeping the robot body off the walls in the 0.86 m
        # hallway. 3.81 let the centre drift until the body clipped a wall; 8.0 held
        # the centreline over 10 goals with no contact (paired with PathFollow 8.0
        # below so it still pushes through soft-cost pinches instead of stalling).
        cost_weight: 8.0
        critical_cost: 300.0
        # true: hard footprint collision check — the definitive guarantee the body
        # never enters an obstacle/inscribed cell (no wall contact). Safe now that
        # the stop-sign keep-out is non-lethal (250), so it no longer causes the
        # false footprint-fail wedges it did when the keep-out was lethal 254. In
        # the tight 0.86 m hallway it may occasionally stop short on a footprint
        # graze; the BackUp recovery extracts that.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        # 5.0 -> 8.0: stronger forward pull so the high CostCritic weight can't
        # freeze the robot at a soft-cost pinch (the "Failed to make progress" stall).
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # Larger window + TF slack to absorb Wi-Fi TF jitter (out-of-map-bounds raytrace warnings).
      width: 4
      height: 4
      resolution: 0.06
      transform_tolerance: 0.5
      # Circular footprint matching the round robot (0.17 m + 1 cm) so inflation can
      # equal the radius: safe (>= inscribed) without over-inflating the 0.86 m hallway.
      robot_radius: 0.18
      # 0.0 (not the 0.01 default) so inscribed == robot_radius 0.18: reclaims 1 cm of
      # corridor clearance so small AMCL yaw drift is less likely to lethal-ize the footprint.
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "perception_layer", "inflation_layer"]
      # Class-aware semantic obstacles from the camera-depth fusion node
      # (/semantic_obstacles). 'stop sign' is persisted in the map frame.
      perception_layer:
        plugin: "tb4_perception_layer::PerceptionLayer"
        enabled: true
        semantic_topic: "/semantic_obstacles"
        obstacle_timeout: 3.0
        # Raised 0.35 -> 0.55: a near-field false detection (e.g. a wall chunk
        # seen as 'person' at a corner) is dropped instead of stamped onto the
        # robot's own footprint.
        min_obstacle_distance: 0.55
        # Non-lethal (<253) so one false frame is soft-avoid, not a footprint
        # collision that makes MPPI fail to compute a path in a tight corridor.
        default_cost: 200
        default_radius: 0.3
        class_names: ['person', 'chair', 'dog', 'cat', 'bicycle', 'stop sign']
        # 'stop sign' = strong deterrent (250, just below inscribed 253): the planner
        # reroutes around its keep-out, but it is NOT lethal, so the inflation_layer
        # (which runs after this one) won't wrap it in an inscribed ring and MPPI /
        # planner can still escape if the robot ends up beside it (no hard trap).
        class_costs: [200, 200, 200, 180, 200, 250]
        class_radii: [0.25, 0.2, 0.2, 0.15, 0.35, 0.5]
        persistent_classes: ['stop sign']
        persistent_frame: "map"
        persistent_timeout: 600.0
        # A stop sign only becomes a costmap obstacle (-> reroute) once the robot
        # is within 1.5 m; farther than that it keeps the old plan.
        persistent_react_distance: 1.5
        # After a Nav2 recovery clears the costmap, don't let the live fusion
        # stream re-stamp transient obstacles for this long, so the robot can
        # move out of a spot a false detection had wedged it into.
        clear_suppression_time: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Gentler slope (was 5.0) + wider radius (was 0.19) give MPPI a smooth
        # centering gradient across the ~0.86 m hallway instead of a near-binary
        # wall, so it holds the corridor centre and clips inscribed cost less at
        # corners. 0.30 < half-corridor (0.43 m) so the centre stays non-lethal.
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      obstacle_layer:
        # 2D layer (not VoxelLayer): the only source is the 2D /scan, and voxel Z bounds
        # broke clearing when odom Z drift pushed the sensor origin below origin_z.
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      robot_radius: 0.18
      # 0.0 (not the 0.01 default) so inscribed == robot_radius 0.18: reclaims 1 cm of
      # corridor clearance so small AMCL yaw drift is less likely to lethal-ize the footprint.
      footprint_padding: 0.0
      resolution: 0.06
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "perception_layer", "inflation_layer"]
      # Class-aware semantic obstacles from the camera-depth fusion node
      # (/semantic_obstacles). 'stop sign' is persisted in the map frame.
      perception_layer:
        plugin: "tb4_perception_layer::PerceptionLayer"
        enabled: true
        semantic_topic: "/semantic_obstacles"
